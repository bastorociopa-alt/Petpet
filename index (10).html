
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PetPet Studio 🐾</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:25px 15px;background:radial-gradient(ellipse at top,#35234c,#100d19 65%);font-family:Segoe UI,Arial,sans-serif;color:#f7efff}
main{max-width:850px;margin:auto}
header{text-align:center;margin-bottom:25px}
h1{font-size:34px;margin:0 0 7px}
header p,.muted{color:#b9accb}
.panel{background:#1d1829;border:1px solid #403451;border-radius:20px;padding:20px;margin-bottom:16px}
.layout{display:grid;grid-template-columns:1fr 260px;gap:18px;align-items:center}
.preview{min-height:300px;display:flex;align-items:center;justify-content:center;background:#100d18;border:1px solid #403451;border-radius:15px;padding:20px}
canvas{width:280px;height:280px;max-width:100%;image-rendering:pixelated;background-color:#211b2b;background-image:linear-gradient(45deg,#30283b 25%,transparent 25%),linear-gradient(-45deg,#30283b 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#30283b 75%),linear-gradient(-45deg,transparent 75%,#30283b 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;border-radius:8px}
.controls{display:flex;flex-direction:column;gap:14px}
button,.file-label{display:block;width:100%;border:0;border-radius:12px;padding:13px;background:linear-gradient(110deg,#8b5cf6,#c026d3);color:white;font-size:14px;font-weight:800;text-align:center;cursor:pointer}
button:hover,.file-label:hover{filter:brightness(1.12)}
.secondary{background:#342a46;border:1px solid #55436b}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=file]{display:none}
input[type=range]{width:100%;accent-color:#c084fc}
.line{display:flex;justify-content:space-between;gap:8px}
.value{font-weight:800;color:#e9c7ff}
.small{font-size:12px;line-height:1.5;color:#b9accb}
.status{font-size:13px;text-align:center;min-height:20px;color:#e3c4ff}
@media(max-width:650px){.layout{grid-template-columns:1fr}.preview{min-height:260px}}
</style>
</head>
<body>
<main>
<header>
<h1>🐾 PetPet Studio</h1>
<p>¡Convierte tus imágenes en PetPets!</p>
</header>

<section class="panel">
<div class="layout">
<div class="preview">
<canvas id="canvas" width="112" height="112"></canvas>
</div>
<div class="controls">
<label class="file-label" for="imageInput">🖼️ Elegir imagen</label>
<input id="imageInput" type="file" accept="image/*">

<div>
<div class="line">
<label for="speed">Velocidad</label>
<span class="value" id="speedLabel">NORMAL · 0.5×</span>
</div>
<input id="speed" type="range" min="0.5" max="2.5" step="0.1" value="0.5">
<p class="small">La mano y el aplastamiento se mueven sincronizados.</p>
</div>

<button id="playButton" class="secondary">⏸️ Pausar animación</button>
<button id="exportButton" disabled>✨ Crear GIF PetPet</button>
<div class="status" id="status">Elige una imagen para empezar 🐾</div>
</div>
</div>
</section>

<section class="panel">
<strong>PetPet Studio</strong>
<p class="small">Animación con la mano original, aplastamiento lateral y vertical, y exportación a 112 × 112 píxeles.</p>
</section>
</main>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const speedInput=document.getElementById("speed");
const speedLabel=document.getElementById("speedLabel");
const statusEl=document.getElementById("status");
const exportButton=document.getElementById("exportButton");
const playButton=document.getElementById("playButton");

const hand=new Image();
const picture=new Image();
let handReady=false;
let pictureReady=false;
let playing=true;
let startTime=performance.now();
let imageURL=null;
let raf=0;

const pressure=[0,.04,.15,.38,.68,.94,1,.82,.48,.12];

function speed(){return Number(speedInput.value)}
function phaseAt(ms){return ((ms*speed()/20)%10+10)%10}
function pressureAt(phase){
 const i=Math.floor(phase)%10;
 const t=phase-Math.floor(phase);
 return pressure[i]+(pressure[(i+1)%10]-pressure[i])*t;
}

function drawPet(ctx2,phase){
 const amount=pressureAt(phase);
 const frame=Math.floor(phase)%10;

 ctx2.clearRect(0,0,112,112);

 if(pictureReady){
   /* Imagen grande, centrada y apoyada en la misma posición */
   const maxW=94;
   const maxH=84;
   const fit=Math.min(maxW/picture.naturalWidth,maxH/picture.naturalHeight);
   const w=picture.naturalWidth*fit;
   const h=picture.naturalHeight*fit;

   /* Se ensancha al bajar la mano y se comprime desde abajo */
   const sx=1+amount*.30;
   const sy=1-amount*.40;

   ctx2.save();
   ctx2.translate(56,101);
   ctx2.scale(sx,sy);
   ctx2.drawImage(picture,-w/2,-h,w,h);
   ctx2.restore();
 }

 if(handReady){
   ctx2.drawImage(hand,0,frame*112,112,112,0,0,112,112);
 }
}

function render(ms){
 drawPet(ctx,phaseAt(ms));
}

function loop(now){
 if(playing)render(now-startTime);
 raf=requestAnimationFrame(loop);
}

hand.onload=()=>{
 handReady=true;
 statusEl.textContent=pictureReady?"¡Listo! Tu PetPet está funcionando 🐾":"Mano original cargada. Elige una imagen.";
 render(0);
};
hand.onerror=()=>{
 statusEl.textContent="Error cargando la mano original.";
};
hand.src=HAND_SPRITE_DATA;

document.getElementById("imageInput").addEventListener("change",e=>{
 const file=e.target.files?.[0];
 if(!file)return;

 if(imageURL)URL.revokeObjectURL(imageURL);
 imageURL=URL.createObjectURL(file);

 picture.onload=()=>{
   pictureReady=true;
   exportButton.disabled=false;
   statusEl.textContent="¡Imagen cargada! Mira cómo funciona ✨";
   startTime=performance.now();
   render(0);
 };
 picture.onerror=()=>{
   pictureReady=false;
   exportButton.disabled=true;
   statusEl.textContent="No se pudo abrir esa imagen.";
 };
 picture.src=imageURL;
});

speedInput.addEventListener("input",()=>{
 const v=speed();
 speedLabel.textContent=(v===0.5?"NORMAL":v.toFixed(1)+"×")+" · "+v.toFixed(1)+"×";
 startTime=performance.now();
 render(0);
});

playButton.addEventListener("click",()=>{
 playing=!playing;
 if(playing){
   startTime=performance.now();
   playButton.textContent="⏸️ Pausar animación";
 }else{
   playButton.textContent="▶️ Reanudar animación";
 }
});

async function exportGIF(){
 if(!pictureReady||!handReady)return;
 if(typeof GIF==="undefined"){
   statusEl.textContent="No se ha cargado el creador de GIF. Comprueba tu conexión.";
   return;
 }

 exportButton.disabled=true;
 statusEl.textContent="Preparando tu PetPet…";

 let workerURL=null;

 try{
   const response=await fetch("https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js");
   if(!response.ok)throw new Error("No se pudo cargar el trabajador GIF.");
   const workerCode=await response.text();
   workerURL=URL.createObjectURL(new Blob([workerCode],{type:"application/javascript"}));

   const gif=new GIF({
     workers:2,
     quality:10,
     width:112,
     height:112,
     workerScript:workerURL,
     transparent:0x000000
   });

   const totalFrames=Math.max(10,Math.round(10/speed()));
   const frameCanvas=document.createElement("canvas");
   frameCanvas.width=112;
   frameCanvas.height=112;
   const frameCtx=frameCanvas.getContext("2d");

   for(let i=0;i<totalFrames;i++){
     const phase=(i*speed())%10;
     drawPet(frameCtx,phase);
     gif.addFrame(frameCanvas,{copy:true,delay:20});
   }

   gif.on("progress",p=>{
     statusEl.textContent="Creando GIF… "+Math.round(p*100)+"%";
   });

   gif.on("finished",blob=>{
     const url=URL.createObjectURL(blob);
     const a=document.createElement("a");
     a.href=url;
     a.download="mi-petpet.gif";
     a.click();
     setTimeout(()=>URL.revokeObjectURL(url),10000);
     if(workerURL)URL.revokeObjectURL(workerURL);
     exportButton.disabled=false;
     statusEl.textContent="¡PETPET CREADO! 🐾";
   });

   gif.render();
 }catch(err){
   console.error(err);
   if(workerURL)URL.revokeObjectURL(workerURL);
   exportButton.disabled=false;
   statusEl.textContent="Error al crear el GIF: "+err.message;
 }
}

exportButton.addEventListener("click",exportGIF);
requestAnimationFrame(loop);
</script>
</body>
</html>
